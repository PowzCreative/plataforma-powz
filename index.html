<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PowZ Lead Radar v7</title>
<style>
:root{--bg:#050a13;--panel:#0b111d;--line:#1c2a3b;--text:#f5f7fb;--muted:#8e9bae;--blue:#2ca8ff;--orange:#ff6a13;--green:#2ee69a;--red:#ff7568}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#0c2038 0,#050a13 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:18px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:800}.logo{width:40px;height:40px;border-radius:11px;background:#29a9f7;color:#06101b;display:grid;place-items:center;font-size:25px;font-weight:900}.mode{color:var(--muted)}.mode b{color:var(--green)}.switch{margin:20px 0;display:grid;grid-template-columns:1fr 1fr;background:#0a101b;border:1px solid var(--line);border-radius:18px;padding:5px}.switch button{border:0;background:transparent;color:#8d99a9;padding:16px;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer}.switch button.active.jobs{background:linear-gradient(100deg,#151c27,#24150d);color:#fff}.switch button.active.clients{background:linear-gradient(100deg,#10263a,#12324c);color:#fff}.eyebrow{font-weight:900;letter-spacing:.12em;color:var(--blue);font-size:13px}.jobs-page .eyebrow{color:var(--orange)}h1{font-size:44px;line-height:1.05;margin:12px 0 8px}.sub{color:var(--muted);font-size:18px;margin:0 0 22px}.scan{border:0;border-radius:12px;padding:14px 22px;font-weight:900;font-size:16px;cursor:pointer;color:#07111c;background:var(--blue)}.jobs-page .scan{background:var(--orange)}.error{margin:18px 0;padding:14px 16px;border:1px solid #7e3029;background:#2a0f0e;color:#ff9a8e;border-radius:12px}.hidden{display:none}.controls{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:18px}.controls select,.controls input{width:100%;padding:15px;background:#0c121d;border:1px solid var(--line);border-radius:12px;color:#fff;font-size:16px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.chips button{background:#101722;border:1px solid var(--line);color:#dce3ed;padding:10px 14px;border-radius:11px;cursor:pointer}.chips button.active{border-color:var(--blue);color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.stat{background:#0a1019;border:1px solid var(--line);border-radius:16px;padding:18px}.stat span{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}.stat strong{font-size:28px}.results{display:grid;gap:12px}.card{background:#0a1019;border:1px solid var(--line);border-radius:16px;padding:18px}.card-top{display:flex;justify-content:space-between;gap:16px}.title{font-weight:850;font-size:18px}.meta{color:var(--muted);font-size:14px;margin-top:7px}.score{font-weight:900;white-space:nowrap}.score.hot{color:#ff9b28}.score.high{color:#2ee69a}.score.possible{color:#66bfff}.desc{color:#b9c3d1;line-height:1.5;margin:13px 0}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:12px;padding:6px 8px;border-radius:8px;background:#111b29;color:#b9c8d9}.actions{display:flex;gap:9px;margin-top:14px}.actions a{color:#8fcfff;text-decoration:none}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.small{color:var(--muted);font-size:13px;margin-top:10px}@media(max-width:800px){.wrap{padding:14px}.controls,.stats{grid-template-columns:1fr}.top{align-items:flex-start}.mode{font-size:12px}h1{font-size:34px}.card-top{display:block}.score{margin-top:10px}}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const SERVICES=['Meta Ads','Media Buying','Google Ads','TikTok Ads','Paid Social'];
let mode='clients', service='Meta Ads', results=[], loading=false;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=x=>{const d=new Date(x);return Number.isNaN(d.getTime())?'Unknown date':d.toLocaleString([], {dateStyle:'medium',timeStyle:'short'});};
function render(){app.className=mode==='jobs'?'jobs-page':'';app.innerHTML=`<header class="top"><div class="brand"><div class="logo">P</div>PowZ Lead Radar</div><div class="mode">Mode: <b>${mode==='clients'?'CLIENTS · Tavily scanning…':'JOBS · Adzuna scanning…'}</b></div></header><div class="switch"><button class="${mode==='jobs'?'active jobs':''}" onclick="setMode('jobs')">🟠 JOBS<br><small>Find your next opportunity</small></button><button class="${mode==='clients'?'active clients':''}" onclick="setMode('clients')">🔵 CLIENTS<br><small>Find your next client</small></button></div>${mode==='clients'?clientView():jobView()}`;}
function baseHeader(kind,title,sub){return `<div class="eyebrow">${kind}</div><h1>${title}</h1><p class="sub">${sub}</p><button class="scan" onclick="scan()">${loading?'Scanning…':mode==='clients'?'Scan for clients':'Scan opportunities'}</button>`}
function clientView(){return baseHeader('CLIENT HUNTER','Find the businesses that need you.','Search public web signals for people explicitly looking for paid-media help.')+`<div id="error"></div><div class="controls"><select onchange="service=this.value;render()">${SERVICES.map(s=>`<option ${s===service?'selected':''}>${s}</option>`).join('')}</select><select id="region"><option value="worldwide">🌎 Worldwide</option><option value="rd">🇩🇴 Local · RD</option></select></div><div class="chips">${SERVICES.map(s=>`<button class="${s===service?'active':''}" onclick="service='${s}';render();scan()">${s}</button>`).join('')}</div><div class="small">Only results with explicit hiring/help intent + a paid-media service + business context are shown. Newest first.</div>${stats()}<div class="results">${cards()}</div>`}
function jobView(){return baseHeader('OPPORTUNITY INTELLIGENCE','Find the work before everyone else.','Remote freelance and paid-media opportunities, ranked for PowZ.')+`<div id="error"></div><div class="controls"><input id="q" placeholder="Search: Meta Ads, media buyer, Google Ads…" value="${esc(service)}"><select id="country"><option value="all">All markets</option><option value="us">United States</option><option value="gb">United Kingdom</option><option value="ca">Canada</option><option value="au">Australia</option><option value="ie">Ireland</option><option value="es">Spain</option><option value="de">Germany</option><option value="nl">Netherlands</option></select></div><div class="chips">${SERVICES.map(s=>`<button class="${s===service?'active':''}" onclick="service='${s}';document.getElementById('q').value=s;scan()">${s}</button>`).join('')}</div><div class="small">Remote only. Sorted by original posting date, newest first.</div>${stats()}<div class="results">${cards()}</div>`}
function stats(){const hot=results.filter(x=>x.score>=85).length, remote=results.filter(x=>x.remote).length, rd=results.filter(x=>x.region==='Dominican Republic').length;return `<div class="stats"><div class="stat"><span>${mode==='clients'?'Potential clients':'Opportunities'}</span><strong>${results.length||'—'}</strong></div><div class="stat"><span>${mode==='clients'?'🔥 Hot':'Remote matches'}</span><strong>${mode==='clients'?hot:remote||'—'}</strong></div><div class="stat"><span>${mode==='clients'?'High potential':'High score'}</span><strong>${results.filter(x=>x.score>=70).length||'—'}</strong></div><div class="stat"><span>${mode==='clients'?'🇩🇴 RD signals':'Worldwide'}</span><strong>${mode==='clients'?rd:results.filter(x=>x.remoteConfidence==='Worldwide').length||'—'}</strong></div><div class="stat"><span>Last scan</span><strong>${results.length?fmtDate(results[0].created):'—'}</strong></div></div>`}
function cards(){if(!results.length)return `<div class="empty">${loading?'Searching live sources…':'Run a scan to see matching results.'}</div>`;return results.map(x=>`<article class="card"><div class="card-top"><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.company||x.source)} · ${esc(x.location||x.region||'Worldwide')} · ${fmtDate(x.created)}</div></div><div class="score ${x.score>=85?'hot':x.score>=70?'high':'possible'}">${x.score}/100</div></div><div class="desc">${esc((x.description||'').slice(0,700))}</div><div class="tags"><span class="tag">${esc(x.service)}</span>${x.remote?'<span class="tag">Remote</span>':''}${x.level?`<span class="tag">${esc(x.level)}</span>`:''}${x.contractType?`<span class="tag">${esc(x.contractType)}</span>`:''}</div><div class="actions"><a href="${esc(x.url)}" target="_blank" rel="noopener">Open source ↗</a>${x.linkedinUrl?`<a href="${esc(x.linkedinUrl)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:''}</div></article>`).join('')}
function setMode(m){mode=m;results=[];render()}
async function scan(){if(loading)return;loading=true;results=[];render();try{let url;if(mode==='clients'){const region=document.getElementById('region')?.value||'worldwide';url=`/api/clients?service=${encodeURIComponent(service)}&region=${region}&minScore=50`;}else{const q=document.getElementById('q')?.value||service;const country=document.getElementById('country')?.value||'all';url=`/api/jobs?q=${encodeURIComponent(q)}&country=${country}&service=${encodeURIComponent(service)}&minScore=55`;}const r=await fetch(url,{cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error(text.slice(0,180)||'Server returned a non-JSON response.')}if(!r.ok)throw new Error(data.detail||data.error||'Search failed.');results=Array.isArray(data.results)?data.results:[];if(data.warnings?.length)console.warn('Connector warnings',data.warnings);}catch(e){document.getElementById('error').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{loading=false;render();}}
render();
</script></body></html>
